<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="nameplate_field">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NAMEPLATE FIELD — Physical Asset Record</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #np-loading-screen {
      position: fixed;
      inset: 0;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 0);
      background-size: 28px 28px;
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .np-loader-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
    }
    .np-logo-box {
      background: #141414;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 18px;
      border-radius: 4px;
      margin-bottom: 24px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    }
    .np-loader-logo {
      height: 52px;
      width: auto;
      display: block;
    }
    .np-loader-kicker {
      font-family: "SF Mono", Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: #ff2a2a;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .np-loader-kicker::before {
      content: "";
      display: inline-block;
      width: 3px;
      height: 12px;
      background: #ff2a2a;
    }
    .np-loader-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #ffffff;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .np-loader-title span {
      font-family: "SF Mono", Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #ff2a2a;
      background: rgba(255, 42, 42, 0.1);
      border: 1px solid rgba(255, 42, 42, 0.4);
      padding: 2px 6px;
      border-radius: 2px;
    }
    .np-loader-sub {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 6px;
      margin-bottom: 28px;
    }
    .np-loader-bar {
      width: 220px;
      height: 2px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .np-loader-progress {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 45%;
      background: #ff2a2a;
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(255, 42, 42, 0.8);
      animation: np-progress 1.4s ease-in-out infinite alternate;
    }
    @keyframes np-progress {
      0% { left: 0%; width: 25%; }
      50% { width: 55%; }
      100% { left: 75%; width: 25%; }
    }
    .np-loader-status {
      font-family: "SF Mono", Menlo, Monaco, Consolas, monospace;
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div id="np-loading-screen">
    <div class="np-loader-wrap">
      <div class="np-logo-box">
        <img src="assets/assets/images/nameplate-logo-transparent.png" alt="Nameplate Logo" class="np-loader-logo" />
      </div>
      <div class="np-loader-kicker">00 / OFFLINE LEDGER</div>
      <div class="np-loader-title">NAMEPLATE <span>FIELD</span></div>
      <div class="np-loader-sub">Every appliance accounted for.</div>
      <div class="np-loader-bar"><div class="np-loader-progress"></div></div>
      <div class="np-loader-status">INITIALIZING FIELD RUNTIME...</div>
    </div>
  </div>

  <script>
    const observer = new MutationObserver(() => {
      const flt = document.querySelector('flutter-view, flt-glass-pane');
      if (flt) {
        observer.disconnect();
        const loader = document.getElementById('np-loading-screen');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.pointerEvents = 'none';
          setTimeout(() => loader.remove(), 480);
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
