<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="French-door refrigerator isometric">
<style>
.ln{fill:none;stroke:#161616;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.thin{fill:none;stroke:#161616;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;opacity:.85}
.face{fill:#fff;fill-opacity:.05;stroke:#161616;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.red{fill:none;stroke:#EB2B2B;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.red-thin{fill:none;stroke:#EB2B2B;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.red-fill{fill:#EB2B2B;stroke:none}
@media (prefers-color-scheme:dark){
.ln,.thin{stroke:#F2F2F2}
.face{stroke:#F2F2F2}
}
</style>
<!-- main cabinet, shared corners (dx 70, dy -40) -->
<path class="face" d="M126 96 L346 96 L346 436 L126 436 Z"/>
<path class="face" d="M346 96 L416 56 L416 396 L346 436 Z"/>
<path class="face" d="M126 96 L196 56 L416 56 L346 96 Z"/>
<!-- top hinge caps -->
<rect class="ln" x="142" y="82" width="36" height="14" rx="2"/>
<rect class="ln" x="294" y="82" width="36" height="14" rx="2"/>
<!-- french doors vertical split -->
<path class="ln" d="M236 96 V316"/>
<!-- freezer drawer horizontal split -->
<path class="ln" d="M126 316 H346"/>
<path class="thin" d="M346 316 L416 276"/>
<!-- french door handles (red) -->
<path class="red" d="M220 126 V266 M252 126 V266"/>
<!-- freezer drawer handle (red) -->
<path class="red" d="M156 342 H316"/>
<!-- ice & water dispenser on left door -->
<rect class="thin" x="142" y="166" width="64" height="88" rx="4"/>
<path class="thin" d="M152 184 H196 M152 196 H196"/>
<rect class="red-thin" x="156" y="210" width="36" height="26" rx="2"/>
<circle cx="174" cy="223" r="3" class="red-fill"/>
<!-- right door interior shelf shadow hints -->
<path class="thin" d="M256 166 H326 M256 200 H326 M256 240 H326"/>
<!-- lower freezer drawer detail -->
<path class="thin" d="M146 396 H216 M256 396 H326"/>
<!-- side compressor ventilation louvers (slope -40/70) -->
<path class="thin" d="M366 350 L396 333 M366 366 L396 349 M366 382 L396 365"/>
<!-- bottom kickplate line -->
<path class="thin" d="M126 422 H346"/>
</svg>
