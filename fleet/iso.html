<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Fleet — Isometric Line Art</title>
  <meta name="description" content="Ten appliances drawn in isometric line art. Full-screen gallery.">
  <meta name="theme-color" content="#050507">
  <link rel="icon" href="../images/nameplate-logo-transparent.png" type="image/png">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      background:#050507;color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Helvetica Neue",Arial,sans-serif;
      overflow:hidden;
    }
    body::before{content:"";position:fixed;inset:0;pointer-events:none;
      background:
        radial-gradient(1000px 520px at 50% -120px,rgba(197,31,45,.14),transparent 60%),
        radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.5px);
      background-size:auto,26px 26px;
    }
    /* ---- the fleet controls every stroke: light lines on dark, always ---- */
    .fleet svg .ln{fill:none;stroke:#F2F2F2;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
    .fleet svg .thin{fill:none;stroke:#F2F2F2;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;opacity:.85}
    .fleet svg .face{fill:#fff;fill-opacity:.05;stroke:#F2F2F2;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
    .fleet svg .red{fill:none;stroke:#c51f2d;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
    .fleet svg .red-thin{fill:none;stroke:#c51f2d;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
    .fleet svg .red-fill{fill:#c51f2d;stroke:none}
    .fleet{
      position:relative;z-index:1;height:100dvh;
      display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);
    }
    .cell{
      position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
      min-height:0;min-width:0;padding:3vh 1.5vw;overflow:hidden;
      border-right:1px solid rgba(255,255,255,.08);
      border-bottom:1px solid rgba(255,255,255,.08);
      transition:background .3s ease;
    }
    .cell:nth-child(5n){border-right:none}
    .cell:nth-child(n+6){border-bottom:none}
    .cell:hover{background:rgba(197,31,45,.06)}
    .cell .idx{
      position:absolute;top:14px;left:16px;z-index:2;
      font-family:"IBM Plex Mono","SF Mono",Menlo,Consolas,monospace;
      font-size:.65rem;letter-spacing:.16em;color:rgba(255,255,255,.32);
    }
    .cell .dot{
      position:absolute;top:18px;right:16px;width:6px;height:6px;border-radius:50%;
      background:#c51f2d;opacity:0;transition:opacity .3s;
    }
    .cell:hover .dot{opacity:1}
    .cell svg{
      flex:1 1 auto;min-height:0;min-width:0;width:100%;max-height:100%;display:block;
      filter:drop-shadow(0 18px 40px rgba(0,0,0,.6));
      transition:transform .45s cubic-bezier(.16,1,.3,1);
    }
    .cell:hover svg{transform:scale(1.05)}
    .cell .name{
      flex:0 0 auto;margin-top:2vh;
      font-family:"IBM Plex Mono","SF Mono",Menlo,Consolas,monospace;
      font-size:.68rem;font-weight:700;letter-spacing:.22em;color:rgba(255,255,255,.6);
    }
    .cell:hover .name{color:#fff}
    @media(max-width:900px){
      body{overflow:auto}
      .fleet{height:auto;min-height:100dvh;grid-template-columns:repeat(2,1fr);grid-template-rows:none}
      .cell{border-right:none;border-bottom:1px solid rgba(255,255,255,.08);aspect-ratio:1/1;padding:16px}
      .cell:nth-child(odd){border-right:1px solid rgba(255,255,255,.08)}
      .cell svg{height:auto;width:100%}
    }
    @media (prefers-reduced-motion:reduce){
      .cell svg,.cell,.cell .dot{transition:none}
    }
  </style>
</head>
