<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Fleet — 10 Units</title>
  <meta name="description" content="Ten appliances rendered in 3D. Full-screen gallery.">
  <meta name="theme-color" content="#050507">
  <link rel="icon" href="../images/nameplate-logo-transparent.png" type="image/png">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      background:#050507;color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Helvetica Neue",Arial,sans-serif;
      overflow:hidden;
    }
    body::before{content:"";position:fixed;inset:0;pointer-events:none;
      background:
        radial-gradient(1000px 520px at 50% -120px,rgba(197,31,45,.14),transparent 60%),
        radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.5px);
      background-size:auto,26px 26px;
    }
    .fleet{
      position:relative;z-index:1;height:100dvh;
      display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);
    }
    .cell{
      position:relative;display:flex;align-items:center;justify-content:center;
      min-height:0;min-width:0;padding:3vh 1.5vw;overflow:hidden;
      border-right:1px solid rgba(255,255,255,.08);
      border-bottom:1px solid rgba(255,255,255,.08);
      transition:background .3s ease;
    }
    .cell:nth-child(5n){border-right:none}
    .cell:nth-child(n+6){border-bottom:none}
    .cell:hover{background:rgba(197,31,45,.06)}
    .cell .idx{
      position:absolute;top:14px;left:16px;z-index:2;
      font-family:"IBM Plex Mono","SF Mono",Menlo,Consolas,monospace;
      font-size:.65rem;letter-spacing:.16em;color:rgba(255,255,255,.32);
    }
    .cell .dot{
      position:absolute;top:18px;right:16px;width:6px;height:6px;border-radius:50%;
      background:#c51f2d;opacity:0;transition:opacity .3s;
    }
    .cell:hover .dot{opacity:1}
    .cell img{
      max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;
      filter:drop-shadow(0 24px 50px rgba(0,0,0,.65));
      transition:transform .45s cubic-bezier(.16,1,.3,1);
    }
    .cell:hover img{transform:scale(1.05)}
    @media(max-width:900px){
      body{overflow:auto}
      .fleet{height:auto;min-height:100dvh;grid-template-columns:repeat(2,1fr);grid-template-rows:none}
      .cell{border-right:none;border-bottom:1px solid rgba(255,255,255,.08);aspect-ratio:1/1;padding:16px}
      .cell:nth-child(odd){border-right:1px solid rgba(255,255,255,.08)}
    }
    @media (prefers-reduced-motion:reduce){
      .cell img,.cell,.cell .dot{transition:none}
    }
  </style>
</head>
<body>
  <main class="fleet" aria-label="Appliance render gallery">
    <figure class="cell"><span class="idx">001</span><span class="dot"></span>
      <img src="../images/renders/fridge.png" alt="French-door refrigerator 3D render">
    </figure>
    <figure class="cell"><span class="idx">002</span><span class="dot"></span>
      <img src="../images/renders/range.png" alt="Range 3D render">
    </figure>
    <figure class="cell"><span class="idx">003</span><span class="dot"></span>
      <img src="../images/renders/washer.png" alt="Washer 3D render">
    </figure>
    <figure class="cell"><span class="idx">004</span><span class="dot"></span>
      <img src="../images/renders/dryer.png" alt="Dryer 3D render">
    </figure>
    <figure class="cell"><span class="idx">005</span><span class="dot"></span>
      <img src="../images/renders/dishwasher.png" alt="Dishwasher 3D render">
    </figure>
    <figure class="cell"><span class="idx">006</span><span class="dot"></span>
      <img src="../images/renders/microwave.png" alt="Microwave 3D render">
    </figure>
    <figure class="cell"><span class="idx">007</span><span class="dot"></span>
      <img src="../images/renders/water-heater.png" alt="Water heater 3D render">
    </figure>
    <figure class="cell"><span class="idx">008</span><span class="dot"></span>
      <img src="../images/renders/hvac.png" alt="Air handler 3D render">
    </figure>
    <figure class="cell"><span class="idx">009</span><span class="dot"></span>
      <img src="../images/renders/thermostat.png" alt="Thermostat 3D render">
    </figure>
    <figure class="cell"><span class="idx">010</span><span class="dot"></span>
      <img src="../images/renders/condenser.png" alt="Condenser 3D render">
    </figure>
  </main>
</body>
</html>
