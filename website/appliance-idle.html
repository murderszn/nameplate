<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAMEPLATE // DOMESTIC SYSTEMS</title>
<style>
:root{
  --bg:#080808;
  --paper:#eee;
  --muted:#777;
  --hair:rgba(255,255,255,.14);
  --red:#ed3030;
  --wash:rgba(237,48,48,.1);
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--paper);
  font-family:var(--mono);
}
body{
  overflow:hidden;
  background-image:radial-gradient(rgba(255,255,255,.15) .65px,transparent .8px);
  background-size:18px 18px;
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.66) 100%);
  z-index:1;
}
body:after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:linear-gradient(90deg,transparent 0 49.9%,rgba(237,48,48,.04) 50%,transparent 50.1%),linear-gradient(180deg,transparent 0 49.9%,rgba(255,255,255,.025) 50%,transparent 50.1%);
  background-size:100% 100%,100% 100%;
  mix-blend-mode:screen;
  z-index:1;
}

header{display:none}

main{
  height:100vh;
  display:flex;
  flex-direction:column;
  padding:4vh 3vw 2.5vh;
  position:relative;
  z-index:2;
}

.intro{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:2vh;
  min-height:clamp(100px,14vh,160px);
}

.intro-left{
  display:flex;
  flex-direction:column;
  gap:12px;
  align-items:flex-start;
}

.intro-right{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:12px;
}

.brand-mark{
  width:clamp(96px,10vw,140px);
  height:auto;
  display:block;
  margin-top:2px;
  filter:brightness(0) invert(1);
  opacity:.94;
}

/* Claude FM Radio Deck (Containerless Telemetry Strip) */
.radio-deck{
  display:flex;
  align-items:center;
  gap:12px;
  background:none;
  border:none;
  padding:0;
  border-radius:0;
  backdrop-filter:none;
  box-shadow:none;
}
.radio-deck.playing{
  border:none;
  background:none;
  box-shadow:none;
}
.radio-meta{
  display:flex;
  align-items:center;
  gap:8px;
}
.radio-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:9px;
  letter-spacing:.15em;
  color:var(--muted);
  font-weight:700;
}
.radio-led{
  width:5px;
  height:5px;
  border-radius:50%;
  background:#444;
  transition:background .2s,box-shadow .2s;
}
.radio-deck.playing .radio-led{
  background:var(--red);
  box-shadow:0 0 8px var(--red);
  animation:blink 1.2s infinite;
}
.radio-freq{
  font-size:9px;
  letter-spacing:.14em;
  color:var(--muted);
  transition:color .2s;
}
.radio-deck.playing .radio-freq{
  color:var(--paper);
}
.radio-sep{
  color:rgba(255,255,255,.2);
  font-size:9px;
  user-select:none;
}
.radio-controls{
  display:flex;
  gap:8px;
  align-items:center;
}
.radio-btn{
  background:none;
  border:none;
  color:var(--paper);
  font-family:var(--mono);
  font-size:9px;
  letter-spacing:.14em;
  padding:2px 4px;
  cursor:pointer;
  transition:color .18s,text-shadow .18s;
  outline:none;
}
.radio-btn:hover{
  color:var(--red);
}
.radio-deck.playing #radio-toggle{
  background:none;
  border:none;
  color:var(--red);
  font-weight:700;
  box-shadow:none;
  text-shadow:0 0 10px rgba(237,48,48,.5);
}
.radio-btn--sub{
  color:var(--muted);
}
.radio-btn--sub:hover{
  color:var(--paper);
}
.radio-btn--sub.active{
  color:var(--red);
  border:none;
  font-weight:700;
  text-shadow:0 0 10px rgba(237,48,48,.5);
}
.radio-eq{
  display:flex;
  gap:2px;
  align-items:flex-end;
  height:12px;
}
.radio-eq span{
  width:2px;
  height:3px;
  background:#444;
  border-radius:1px;
  transition:height .2s,background .2s;
}
.radio-deck.playing .radio-eq span{
  background:var(--red);
  animation:eq 0.75s ease-in-out infinite alternate;
}
.radio-deck.playing .radio-eq span:nth-child(1){animation-delay:.08s}
.radio-deck.playing .radio-eq span:nth-child(2){animation-delay:.28s}
.radio-deck.playing .radio-eq span:nth-child(3){animation-delay:.16s}
.radio-deck.playing .radio-eq span:nth-child(4){animation-delay:.36s}
.radio-deck.playing .radio-eq span:nth-child(5){animation-delay:.22s}
@keyframes eq{
  0%{height:2px}
  100%{height:14px}
}

.intro h1{
  font-size:clamp(24px,3.8vw,56px);
  font-weight:400;
  letter-spacing:-.08em;
  line-height:.92;
  text-align:right;
  margin:0;
}
.intro h1 em{
  font-style:normal;
  color:#777;
}

.grid{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  grid-template-rows:repeat(2,1fr);
  border:1px solid var(--hair);
}
.cell{
  position:relative;
  min-width:0;
  min-height:0;
  border-right:1px solid var(--hair);
  border-bottom:1px solid var(--hair);
  padding:13px 15px 12px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  overflow:hidden;
  transition:background .8s ease,opacity .8s ease;
}
.cell:nth-child(5n){border-right:0}
.cell:nth-child(n+6){border-bottom:0}
.cell:before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.03),transparent 42%);
  opacity:.5;
}
.cell.active{background:var(--wash)}
.cell.active:after{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:2px;
  background:var(--red);
  box-shadow:0 0 16px rgba(237,48,48,.55);
}
.cell:not(.active){opacity:.7}
.cell-head,.cell-foot{
  position:relative;
  z-index:1;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:9px;
  letter-spacing:.12em;
  color:var(--muted);
}
.cell.active .cell-head,.cell.active .cell-foot{color:var(--red)}
.dot{
  width:5px;
  height:5px;
  border:1px solid currentColor;
  border-radius:50%;
}
.cell.active .dot{
  background:var(--red);
  box-shadow:0 0 10px var(--red);
}
.art{
  position:relative;
  z-index:1;
  flex:1;
  display:grid;
  place-items:center;
  padding:4px 0;
}
.art img{
  width:112%;
  height:112%;
  max-height:190px;
  object-fit:contain;
  filter:grayscale(1) contrast(1.12) brightness(1.34);
  transition:transform 1.2s cubic-bezier(.16,1,.3,1),filter 1.2s;
}
.cell.active .art img{
  transform:scale(1.08);
  filter:grayscale(1) contrast(1.2) brightness(1.55);
}
.cell-name{
  font-size:clamp(9px,1vw,13px);
  letter-spacing:.16em;
  color:var(--paper);
}
.cell-index{font-size:9px}
.cell.active .cell-name{color:#fff}

.footer{
  height:26px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#777;
  font-size:9px;
  letter-spacing:.14em;
  padding-top:10px;
}
.footer b{font-weight:600;color:#bbb}

/* Floating Claude FM Video Monitor (PiP) */
.radio-pip{
  position:fixed;
  right:28px;
  bottom:38px;
  width:320px;
  background:#0c0e11;
  border:1px solid rgba(255,255,255,.2);
  border-radius:6px;
  box-shadow:0 20px 48px rgba(0,0,0,.85),0 0 24px rgba(237,48,48,.15);
  z-index:90;
  overflow:hidden;
  transition:transform .25s ease,opacity .25s ease,visibility .25s;
}
.radio-pip.hidden-video{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transform:translateY(12px) scale(.95);
}
.radio-pip-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:7px 12px;
  background:#13161b;
  border-bottom:1px solid var(--hair);
  font-size:8px;
  letter-spacing:.14em;
  color:var(--muted);
}
.radio-pip-title{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--paper);
  font-weight:600;
}
.pip-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--red);
  box-shadow:0 0 6px var(--red);
}
.radio-pip-actions{
  display:flex;
  gap:10px;
  align-items:center;
}
.radio-pip-actions a,.radio-pip-actions button{
  background:none;
  border:none;
  color:var(--muted);
  font-size:10px;
  cursor:pointer;
  text-decoration:none;
  padding:0 2px;
  font-family:inherit;
}
.radio-pip-actions button:hover,.radio-pip-actions a:hover{color:#fff}
.radio-pip-body{
  position:relative;
  width:100%;
  padding-top:56.25%; /* 16:9 ratio */
  background:#000;
}
.radio-pip-body iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
}

/* Hidden container for audio playback when video is minimized */
#audio-stream-vault{
  position:fixed;
  left:-9999px;
  top:-9999px;
  width:1px;
  height:1px;
  opacity:0;
  pointer-events:none;
}

.fullscreen main{height:100vh;padding:4vh 4vw 3vh}
.fullscreen .footer{display:none}

@keyframes blink{50%{opacity:.25}}

@media(max-width:850px){
  body{overflow:auto}
  main{height:auto;min-height:100vh;padding:24px 16px}
  .intro{flex-direction:column;gap:18px;align-items:flex-start}
  .intro-right{align-items:flex-start;width:100%;gap:14px}
  .intro h1{text-align:left;font-size:32px}
  .grid{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(5,180px)}
  .cell{border-right:1px solid var(--hair)!important;border-bottom:1px solid var(--hair)!important}
  .cell:nth-child(2n){border-right:0!important}
  .cell:nth-child(n+9){border-bottom:0!important}
  .radio-pip{width:calc(100vw - 32px);right:16px;bottom:16px}
}
</style>
</head>
<body>
<main>
  <section class="intro">
    <div class="intro-left">
      <img class="brand-mark" src="images/nameplate-logo-transparent.png" alt="Nameplate">
    </div>

    <div class="intro-right">
      <h1>Everything working.<br><em>Nothing ordinary.</em></h1>

      <!-- Claude FM Radio Deck -->
      <div class="radio-deck" id="radio-deck">
        <div class="radio-meta">
          <span class="radio-pill">
            <i class="radio-led"></i>
            <span id="radio-status">RADIO STANDBY</span>
          </span>
          <span class="radio-sep" aria-hidden="true">·</span>
          <span class="radio-freq">CLAUDE FM // LIVE RADIO</span>
        </div>
        <span class="radio-sep" aria-hidden="true">·</span>
        <div class="radio-eq" id="radio-eq" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <span class="radio-sep" aria-hidden="true">·</span>
        <div class="radio-controls">
          <button type="button" class="radio-btn" id="radio-toggle" title="Toggle Lo-Fi Radio (Key: M)">▶ TUNE IN</button>
          <span class="radio-sep" aria-hidden="true">·</span>
          <button type="button" class="radio-btn radio-btn--sub" id="video-toggle" title="Toggle Mini Video Monitor (Key: V)">◰ VIDEO</button>
        </div>
      </div>
    </div>
  </section>

  <section class="grid" id="grid"></section>

  <div class="footer" id="footer">
    <span>← → SWITCH UNIT &nbsp;·&nbsp; <b>SPACE</b> PAUSE &nbsp;·&nbsp; <b>M</b> CLAUDE FM &nbsp;·&nbsp; <b>V</b> VIDEO &nbsp;·&nbsp; <b>F</b> FULLSCREEN</span>
    <span id="footer-status">LIVE DOMESTIC ARCHIVE</span>
  </div>
</main>

<!-- Floating Claude FM Video Monitor (PiP) -->
<div class="radio-pip hidden-video" id="radio-pip">
  <div class="radio-pip-head">
    <div class="radio-pip-title">
      <span class="pip-dot"></span>
      <span>CLAUDE FM · 24/7 LO-FI STREAM</span>
    </div>
    <div class="radio-pip-actions">
      <a href="https://clau.de/radio" target="_blank" rel="noreferrer" title="Open Stream on YouTube">↗</a>
      <button type="button" id="pip-close" title="Minimize video to background audio">✕</button>
    </div>
  </div>
  <div class="radio-pip-body" id="pip-container">
    <!-- Active YouTube player lives here when video is visible -->
  </div>
</div>

<!-- Vault for continuous background audio stream when video is hidden -->
<div id="audio-stream-vault"></div>

<script>
const units = [
  ['FRIDGE','fridge.svg','PRESERVATION'],
  ['RANGE','range.svg','HEAT SYSTEM'],
  ['WASHER','washer.svg','CYCLE ACTIVE'],
  ['DRYER','dryer.svg','TUMBLE READY'],
  ['DISHWASHER','dishwasher.svg','RINSE STANDBY'],
  ['MICROWAVE','microwave.svg','COOK STANDBY'],
  ['WATER HEATER','water-heater.svg','RESERVOIR ACTIVE'],
  ['AIR HANDLER','hvac.svg','AIRFLOW ACTIVE'],
  ['THERMOSTAT','thermostat.svg','72° NOMINAL'],
  ['CONDENSER','condenser.svg','FAN READY']
];

const grid = document.querySelector('#grid');
let active = 2, paused = false, timer;

units.forEach((u, i) => {
  const cell = document.createElement('article');
  cell.className = 'cell' + (i === active ? ' active' : '');
  cell.dataset.i = i;
  cell.innerHTML = `
    <div class="cell-head"><span>${String(i + 1).padStart(3, '0')} //</span><span class="dot"></span></div>
    <div class="art"><img src="images/iso/${u[1]}" alt="${u[0]} isometric illustration"></div>
    <div class="cell-foot"><span class="cell-name">${u[0]}</span><span>${u[2]}</span></div>
  `;
  cell.addEventListener('click', () => select(i));
  grid.appendChild(cell);
});

function select(i) {
  active = (i + units.length) % units.length;
  document.querySelectorAll('.cell').forEach((c, n) => c.classList.toggle('active', n === active));
}

function next() {
  if (!paused) select(active + 1);
}

function resetTimer() {
  clearInterval(timer);
  timer = setInterval(next, 4000);
}

// -------------------------------------------------------------
// Claude FM Radio & Embedded Video Player Controller
// -------------------------------------------------------------
const radioToggle = document.querySelector('#radio-toggle');
const videoToggle = document.querySelector('#video-toggle');
const radioDeck = document.querySelector('#radio-deck');
const radioStatus = document.querySelector('#radio-status');
const footerStatus = document.querySelector('#footer-status');
const radioPip = document.querySelector('#radio-pip');
const pipClose = document.querySelector('#pip-close');
const pipContainer = document.querySelector('#pip-container');
const audioVault = document.querySelector('#audio-stream-vault');

let radioPlaying = false;
let videoVisible = false;
let playerIframe = null;

function ensurePlayerMounted() {
  if (!playerIframe) {
    playerIframe = document.createElement('iframe');
    // Using official Claude FM YouTube livestream with JS API and autoplay
    playerIframe.src = 'https://www.youtube-nocookie.com/embed/tRsQsTMvPNg?enablejsapi=1&autoplay=1&playsinline=1';
    playerIframe.title = 'Claude FM 24/7 Lo-Fi Radio';
    playerIframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
    playerIframe.allowFullscreen = true;

    // Attach to active container
    if (videoVisible) {
      pipContainer.appendChild(playerIframe);
    } else {
      audioVault.appendChild(playerIframe);
    }
  }
}

function syncPlayerContainer() {
  if (!playerIframe) return;
  if (videoVisible) {
    if (playerIframe.parentElement !== pipContainer) {
      pipContainer.appendChild(playerIframe);
    }
  } else {
    if (playerIframe.parentElement !== audioVault) {
      audioVault.appendChild(playerIframe);
    }
  }
}

function toggleRadio(forcePlay) {
  const nextState = forcePlay !== undefined ? forcePlay : !radioPlaying;
  if (nextState) {
    ensurePlayerMounted();
    try {
      playerIframe.contentWindow?.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
    } catch (_) {}

    radioPlaying = true;
    radioDeck.classList.add('playing');
    radioStatus.textContent = 'CLAUDE FM LIVE';
    radioToggle.textContent = '⏸ PAUSE';
    if (footerStatus) footerStatus.textContent = 'CLAUDE FM // ON AIR';
  } else {
    if (playerIframe) {
      try {
        playerIframe.contentWindow?.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
      } catch (_) {}
    }
    radioPlaying = false;
    radioDeck.classList.remove('playing');
    radioStatus.textContent = 'RADIO PAUSED';
    radioToggle.textContent = '▶ TUNE IN';
    if (footerStatus) footerStatus.textContent = 'LIVE DOMESTIC ARCHIVE';
  }
}

function toggleVideo(forceShow) {
  videoVisible = forceShow !== undefined ? forceShow : !videoVisible;
  radioPip.classList.toggle('hidden-video', !videoVisible);
  videoToggle.classList.toggle('active', videoVisible);

  syncPlayerContainer();

  if (videoVisible && !radioPlaying) {
    toggleRadio(true);
  }
}

radioToggle.addEventListener('click', () => toggleRadio());
videoToggle.addEventListener('click', () => toggleVideo());
pipClose.addEventListener('click', () => toggleVideo(false));

// Global Keyboard Shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'f') {
    document.documentElement.classList.toggle('fullscreen');
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen?.();
    } else {
      document.exitFullscreen?.();
    }
    return;
  }
  if (e.key.toLowerCase() === 'm') {
    toggleRadio();
    return;
  }
  if (e.key.toLowerCase() === 'v') {
    toggleVideo();
    return;
  }
  if (e.key === 'ArrowRight') {
    select(active + 1);
    resetTimer();
    return;
  }
  if (e.key === 'ArrowLeft') {
    select(active - 1);
    resetTimer();
    return;
  }
  if (e.code === 'Space') {
    e.preventDefault();
    paused = !paused;
    const liveIndicator = document.querySelector('#footer-status');
    if (liveIndicator) {
      liveIndicator.textContent = paused ? 'ARCHIVE PAUSED' : (radioPlaying ? 'CLAUDE FM // ON AIR' : 'LIVE DOMESTIC ARCHIVE');
    }
  }
});

document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) {
    document.documentElement.classList.remove('fullscreen');
  }
});

resetTimer();
</script>
</body>
</html>
