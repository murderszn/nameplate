<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="GE Profile undercounter dishwasher isometric">
<style>
.ln{fill:none;stroke:#161616;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.thin{fill:none;stroke:#161616;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;opacity:.85}
.face{fill:#fff;fill-opacity:.05;stroke:#161616;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.red{fill:none;stroke:#EB2B2B;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.red-thin{fill:none;stroke:#EB2B2B;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.red-fill{fill:#EB2B2B;stroke:none}
@media (prefers-color-scheme:dark){
.ln,.thin{stroke:#F2F2F2}
.face{stroke:#F2F2F2}
}
</style>
<!-- main chassis, shared corners (dx 70, dy -40) -->
<path class="face" d="M126 146 L346 146 L346 436 L126 436 Z"/>
<path class="face" d="M346 146 L416 106 L416 396 L346 436 Z"/>
<path class="face" d="M126 146 L196 106 L416 106 L346 146 Z"/>
<!-- top touch control panel band -->
<path class="ln" d="M126 186 H346"/>
<path class="thin" d="M346 186 L416 146"/>
<circle cx="152" cy="166" r="4" class="red-fill"/>
<circle class="thin" cx="172" cy="166" r="4"/>
<circle class="thin" cx="190" cy="166" r="4"/>
<path class="thin" d="M220 166 H320"/>
<!-- full-width towel bar handle (red) with mounting stanchions -->
<rect class="ln" x="144" y="194" width="8" height="18" rx="1"/>
<rect class="ln" x="320" y="194" width="8" height="18" rx="1"/>
<rect class="red" x="136" y="196" width="200" height="14" rx="4"/>
<!-- blueprint interior cutaway: rack + spray arm -->
<rect class="ln" x="146" y="226" width="180" height="154" rx="6"/>
<!-- upper dishrack -->
<path class="thin" d="M154 250 H318 M154 274 H318"/>
<path class="thin" d="M170 242 V282 M196 242 V282 M222 242 V282 M248 242 V282 M274 242 V282 M300 242 V282"/>
<!-- lower dishrack with red tines -->
<path class="thin" d="M154 306 H318 M154 330 H318"/>
<path class="red-thin" d="M170 298 V338 M196 298 V338 M222 298 V338 M248 298 V338 M274 298 V338 M300 298 V338"/>
<!-- rotating spray arm (red) -->
<circle class="red" cx="236" cy="354" r="7"/>
<path class="red" d="M182 354 Q208 351 236 354 Q264 357 290 354"/>
<circle cx="196" cy="353" r="2" class="red-fill"/>
<circle cx="276" cy="355" r="2" class="red-fill"/>
<!-- toe kick plate -->
<path class="ln" d="M126 396 H346 V436 H126 Z"/>
<path class="thin" d="M150 416 H240"/>
<!-- side panel detail -->
<path class="thin" d="M366 170 L396 153 M366 320 L396 303"/>
<!-- feet -->
<path class="ln" d="M156 436 V444 M316 436 V444"/>
</svg>
