<!DOCTYPE html>
<html>
<head>
  <script>
    (function () {
      if (!location.pathname.endsWith('/') && !location.pathname.endsWith('.html')) {
        location.replace(location.pathname + '/' + location.search + location.hash);
      }
    })();
  </script>
  <base href="./">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Nameplate Field — the offline-first app for maintenance technicians.">
  <meta name="theme-color" content="#000000">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Nameplate">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NAMEPLATE FIELD — Physical Asset Record</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #np-loading-screen {
      position: fixed;
      inset: 0;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      background-image: radial-gradient(rgba(0, 0, 0, 0.035) 1px, transparent 0);
      background-size: 28px 28px;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .np-loader-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
    }
    .np-logo-box {
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.12);
      padding: 20px;
      border-radius: 4px;
      margin-bottom: 28px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }
    .np-loader-logo {
      height: 56px;
      width: auto;
      display: block;
    }
    .np-loader-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #111111;
      margin: 0;
    }
    .np-loader-sub {
      font-size: 13px;
      color: rgba(17, 17, 17, 0.7);
      margin-top: 8px;
      margin-bottom: 36px;
      font-weight: 400;
    }
    .np-loader-bar {
      width: 220px;
      height: 2px;
      background: rgba(0, 0, 0, 0.12);
      border-radius: 1px;
      overflow: hidden;
      position: relative;
    }
    .np-loader-progress {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 45%;
      background: #eb2b2b;
      border-radius: 1px;
      animation: np-progress 1.4s ease-in-out infinite alternate;
    }
    @keyframes np-progress {
      0% { left: 0%; width: 25%; }
      50% { width: 55%; }
      100% { left: 75%; width: 25%; }
    }
  </style>
</head>
<body>
  <div id="np-loading-screen">
    <div class="np-loader-wrap">
      <div class="np-logo-box">
        <img src="nameplate-logo-light.png" alt="Nameplate" class="np-loader-logo" />
      </div>
      <h1 class="np-loader-title">NAMEPLATE</h1>
      <div class="np-loader-sub">Every appliance accounted for.</div>
      <div class="np-loader-bar"><div class="np-loader-progress"></div></div>
    </div>
  </div>

  <script>
    const observer = new MutationObserver(() => {
      const flt = document.querySelector('flutter-view, flt-glass-pane');
      if (flt) {
        observer.disconnect();
        const loader = document.getElementById('np-loading-screen');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.pointerEvents = 'none';
          setTimeout(() => loader.remove(), 480);
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
