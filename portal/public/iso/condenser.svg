<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="Outdoor split condenser isometric">
<style>
.ln{fill:none;stroke:#161616;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.thin{fill:none;stroke:#161616;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;opacity:.85}
.face{fill:#fff;fill-opacity:.05;stroke:#161616;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.red{fill:none;stroke:#c51f2d;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.red-thin{fill:none;stroke:#c51f2d;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.red-fill{fill:#c51f2d;stroke:none}
@media (prefers-color-scheme:dark){
.ln,.thin{stroke:#F2F2F2}
.face{stroke:#F2F2F2}
}
</style>
<!-- cube chassis, shared corners (dx 70, dy -40) -->
<path class="face" d="M126 166 L346 166 L346 436 L126 436 Z"/>
<path class="face" d="M346 166 L416 126 L416 396 L346 436 Z"/>
<path class="face" d="M126 166 L196 126 L416 126 L346 166 Z"/>
<!-- top discharge fan grille (centered at cx 271 cy 146) -->
<ellipse class="ln" cx="271" cy="146" rx="74" ry="22"/>
<ellipse class="thin" cx="271" cy="146" rx="52" ry="15"/>
<circle class="red" cx="271" cy="146" r="9"/>
<!-- aerodynamic condenser fan blades (red) -->
<path class="red-thin" d="M271 137 C260 125 240 128 225 138 M271 155 C282 167 302 164 317 154 M280 146 C295 140 310 130 320 134 M262 146 C247 152 232 162 222 158"/>
<!-- front coil fin louvers -->
<path class="thin" d="M142 196 H330 M142 214 H330 M142 232 H330 M142 250 H330 M142 268 H330 M142 286 H330 M142 304 H330 M142 322 H330"/>
<!-- side coil fin louvers (slope -40/70) -->
<path class="thin" d="M356 186 L406 157 M356 204 L406 175 M356 222 L406 193 M356 240 L406 211 M356 258 L406 229 M356 276 L406 247 M356 294 L406 265"/>
<!-- service valve & electrical compartment -->
<rect class="ln" x="142" y="342" width="100" height="74" rx="4"/>
<!-- brass service valves (red caps) -->
<circle class="red" cx="166" cy="378" r="6"/>
<circle class="red-thin" cx="190" cy="378" r="6"/>
<circle class="thin" cx="220" cy="378" r="5"/>
<path class="thin" d="M154 358 H200 M154 366 H190"/>
<!-- base pan -->
<path class="thin" d="M126 424 H346"/>
<path class="thin" d="M346 424 L416 384"/>
<!-- vibration isolation mounting feet -->
<path class="ln" d="M146 436 V446 M326 436 V446 M396 396 V406"/>
</svg>
